# ══════════════════════════════════════════════════════════════════════════════
# Nuvant Vision System — Multi-Línea (Modular)
#
# FASE ACTUAL: 1 línea, 1 cámara (bridge-l1-final)
# ESCALAR:    Duplicar el bloque bridge-l1-final, cambiar CAMERA_LINE_ID,
#             CAMERA_POINT_ID y CAMERA_ID — sin cambios de código.
# ══════════════════════════════════════════════════════════════════════════════

# ── Definición base reutilizable (Extension) ──────────────────────────────
x-bridge-base: &bridge-base
  build:
    context: ./camera_bridge
    dockerfile: Dockerfile
  depends_on:
    nuvant-backend:
      condition: service_healthy
  # NOTA: network_mode host es recomendado para GigE Vision (UDP discovery/stream)
  network_mode: host
  restart: unless-stopped
  environment: &bridge-env-base
    VA_BACKEND_WS_URL: "ws://localhost:8000/api/inference/camera_feed"
    SIMULATE_DIR: "/simulate_images"
    JPEG_QUALITY: "80"

services:

  # ── Backend de Visión Artificial ───────────────────────────────────────────
  nuvant-backend:
    build:
      context: ./Nuvant_VA
      dockerfile: docker/Dockerfile
    container_name: nuvant-backend
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./Nuvant_VA/backend/local_storage:/app/local_storage
      - ./Nuvant_VA/backend/db:/app/db
      - ./Nuvant_VA/backend/logs:/app/logs
    environment:
      - ENV=production
      - PYTHONUNBUFFERED=1
      - STORAGE_DIR=/app/local_storage
      - DATABASE_URL=sqlite:////app/db/nuvant.db
      - PATCHCORE_CORESET_RATIO=0.1
      - PATCHCORE_NEIGHBORS=9
      - PATCHCORE_ROI_CROP=0.08
      - PATCHCORE_USE_CLAHE=true
      - PATCHCORE_THRESHOLD_MARGIN=1.5
      # Debounce: N frames consecutivos anómalos para confirmar y guardar un defecto.
      # N=1: guarda en el primer frame anómalo. El umbral margin=1.5 controla los falsos positivos.
      - INSPECT_DEBOUNCE_FRAMES=1
      - TRAIN_CAPTURE_LIMIT=200
      - TRAIN_SAMPLE_SIZE=150
      # PLC S7: definir PLC_IP en .env para activar (ej. PLC_IP=192.168.1.10)
      - PLC_IP=${PLC_IP:-}
      - PLC_DB=${PLC_DB:-1}
      - PLC_BYTE=${PLC_BYTE:-0}
      - PLC_BIT=${PLC_BIT:-0}
      - PLC_RACK=${PLC_RACK:-0}
      - PLC_SLOT=${PLC_SLOT:-1}
    networks:
      - nuvant-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 60s

  # ══════════════════════════════════════════════════════════════════════════
  # LÍNEA 1 — Punto: Final / Enrollado
  # ── Fase actual: única cámara en producción
  # ══════════════════════════════════════════════════════════════════════════
  bridge-l1-final:
    <<: *bridge-base
    container_name: bridge-linea1-final
    volumes:
      - ./Nuvant_ETL/Nuvant-OSD25013/Omron-camera/scripts/captures:/camera_captures:ro
    environment:
      <<: *bridge-env-base
      CAMERA_MODE: "live"
      SIMULATE_DIR: "/camera_captures"
      # Mayor FPS = más frames/seg = mayor probabilidad de capturar defectos a alta velocidad de línea.
      # 10 FPS recomendado; 15-20 si la cámara y el backend aguantan (inferencia ~100-200ms/frame).
      CAMERA_FPS: "${CAMERA_FPS:-15.0}"
      CAMERA_LINE_ID: "1"
      CAMERA_POINT_ID: "1"
      CAMERA_ID: "cam-l1-final"
      CAMERA_IP: "${CAMERA_IP:-}"
      CAMERA_FORCE_IP: "${CAMERA_FORCE_IP:-169.254.75.178}"
  # ══════════════════════════════════════════════════════════════════════════
  # FUTURAS CÁMARAS (descomentar cuando estén disponibles)
  # ══════════════════════════════════════════════════════════════════════════

  # Línea 1 — Inicio
  # bridge-l1-inicio:
  #   <<: *bridge-base
  #   container_name: bridge-linea1-inicio
  #   volumes:
  #     - ./simulate_images:/simulate_images:ro
  #   environment:
  #     <<: *bridge-env-base
  #     CAMERA_MODE:     simulate
  #     CAMERA_LINE_ID:  "1"
  #     CAMERA_POINT_ID: "2"
  #     CAMERA_ID:       "cam-l1-inicio"

  # Línea 2 — Final
  # bridge-l2-final:
  #   <<: *bridge-base
  #   container_name: bridge-linea2-final
  #   environment:
  #     <<: *bridge-env-base
  #     CAMERA_MODE:     live
  #     CAMERA_LINE_ID:  "2"
  #     CAMERA_POINT_ID: "3"
  #     CAMERA_ID:       "cam-l2-final"



networks:
  nuvant-net:
    driver: bridge
