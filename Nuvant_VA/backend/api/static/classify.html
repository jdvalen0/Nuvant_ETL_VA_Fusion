<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cola de Clasificación — Nuvant Vision</title>
    <script src="vendor/tailwind.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    <div class="container mx-auto p-6">
        <header class="mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold text-cyan-300">Cola de Clasificación de Defectos</h1>
            <p class="text-slate-400 text-sm mt-1">Clasifique todos los defectos antes de generar el informe.</p>
        </header>

        <div class="mb-6 flex gap-4 items-center">
            <label class="text-slate-400">Referencia:</label>
            <select id="refSelect" class="bg-slate-800 border border-slate-600 rounded px-4 py-2">
                <option value="">Seleccione...</option>
            </select>
            <button onclick="loadQueue()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded font-semibold">
                Cargar cola
            </button>
            <a href="/static/" class="text-cyan-400 hover:underline text-sm">← Volver a inspección</a>
        </div>

        <div id="queueStatus" class="mb-4 p-4 rounded bg-slate-800 border border-slate-700 hidden">
            <span id="queueCount" class="font-bold text-orange-400">0</span> defectos sin clasificar
        </div>

        <div id="emptyState" class="p-8 text-center text-slate-500 rounded bg-slate-800 border border-slate-700">
            Seleccione una referencia y pulse "Cargar cola".
        </div>

        <div id="queueGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden">
            <!-- Cards de defectos se insertan aquí -->
        </div>

        <div id="allDone" class="p-8 text-center text-green-400 rounded bg-green-900/30 border border-green-800 hidden">
            ✓ Todos los defectos clasificados. Puede generar el informe desde la pantalla principal.
        </div>

        <div id="toast" class="fixed bottom-4 right-4 px-4 py-2 rounded bg-green-700 text-white text-sm font-bold hidden z-50">
            ✓ Clasificado
        </div>
    </div>

    <script>
        const API = `${window.location.origin}/api`;
        let defectTypes = [];

        async function loadRefs() {
            const res = await fetch(`${API}/references/`);
            const refs = await res.json();
            const sel = document.getElementById('refSelect');
            sel.innerHTML = '<option value="">Seleccione...</option>';
            refs.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = `${r.name} (ID: ${r.id})`;
                sel.appendChild(opt);
            });
        }

        async function loadDefectTypes() {
            const res = await fetch(`${API}/references/defect_types`);
            defectTypes = await res.json();
        }

        async function loadQueue() {
            const refId = document.getElementById('refSelect').value;
            if (!refId) return alert('Seleccione una referencia');
            const res = await fetch(`${API}/references/${refId}/unclassified_defects`);
            const defects = await res.json();
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('allDone').classList.add('hidden');
            if (defects.length === 0) {
                document.getElementById('queueStatus').classList.add('hidden');
                document.getElementById('queueGrid').classList.add('hidden');
                document.getElementById('allDone').classList.remove('hidden');
                return;
            }
            document.getElementById('queueStatus').classList.remove('hidden');
            document.getElementById('queueCount').textContent = defects.length;
            document.getElementById('queueGrid').classList.remove('hidden');
            const grid = document.getElementById('queueGrid');
            grid.innerHTML = defects.map(d => `
                <div class="bg-slate-800 rounded-lg border border-slate-700 p-4" data-id="${d.id}">
                    <div class="mb-2 h-32 bg-slate-900 rounded flex items-center justify-center overflow-hidden">
                        ${d.has_image
                            ? `<img src="${API}/references/defect/${d.id}/image" alt="defecto" class="max-h-full max-w-full object-contain" onerror="this.parentElement.innerHTML='<span class=text-slate-500>Sin imagen</span>'"/>`
                            : '<span class="text-slate-500">Sin imagen</span>'}
                    </div>
                    <p class="text-xs text-slate-500">ID: ${d.id} | Score: ${d.anomaly_score} | ${d.timestamp ? d.timestamp.slice(0, 19) : '-'}</p>
                    <div class="mt-2 flex gap-2">
                        <select class="defect-type-select flex-1 bg-slate-700 border border-slate-600 rounded p-2 text-sm" data-id="${d.id}">
                            <option value="">-- Tipo --</option>
                            ${defectTypes.map(t => `<option value="${t.name}">${t.name}</option>`).join('')}
                        </select>
                        <button onclick="classifyOne(${d.id})" class="bg-orange-600 hover:bg-orange-500 px-3 py-2 rounded text-sm font-bold">
                            Clasificar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function parseErrorDetail(detail) {
            if (typeof detail === 'string') return detail;
            if (Array.isArray(detail) && detail.length > 0) {
                const first = detail[0];
                return (first && first.msg) ? first.msg : JSON.stringify(detail);
            }
            if (detail && typeof detail === 'object') return JSON.stringify(detail);
            return 'Error al clasificar';
        }

        async function classifyOne(defectLogId) {
            const card = document.querySelector(`[data-id="${defectLogId}"]`);
            if (!card) return;
            const select = card.querySelector('.defect-type-select');
            const defectType = select.value;
            if (!defectType) return alert('Seleccione un tipo de defecto');
            const refId = document.getElementById('refSelect').value;
            if (!refId) return alert('Seleccione una referencia');
            const btn = card.querySelector('button');
            if (btn) { btn.disabled = true; btn.textContent = '...'; }
            try {
                const res = await fetch(`${API}/inference/log_defect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reference_id: parseInt(refId),
                        defect_type: defectType,
                        defect_log_id: defectLogId,
                        score: 0,
                        embedding: null
                    })
                });
                let data = {};
                try { data = await res.json(); } catch (_) {}
                if (!res.ok) {
                    const msg = parseErrorDetail(data.detail);
                    if (btn) { btn.disabled = false; btn.textContent = 'Clasificar'; }
                    return alert('Error: ' + msg);
                }
                card.remove();
                const remaining = document.querySelectorAll('#queueGrid > div').length;
                document.getElementById('queueCount').textContent = remaining;
                if (remaining === 0) {
                    document.getElementById('queueStatus').classList.add('hidden');
                    document.getElementById('queueGrid').classList.add('hidden');
                    document.getElementById('allDone').classList.remove('hidden');
                }
                const toast = document.getElementById('toast');
                if (toast) {
                    toast.textContent = '✓ Clasificado: ' + defectType;
                    toast.classList.remove('hidden');
                    setTimeout(() => toast.classList.add('hidden'), 2000);
                }
            } catch (e) {
                if (btn) { btn.disabled = false; btn.textContent = 'Clasificar'; }
                alert('Error de conexión: ' + (e.message || String(e)));
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadDefectTypes();
                await loadRefs();
            } catch (e) {
                console.error('Init error:', e);
                alert('Error al cargar datos. Revise la consola (F12).');
            }
        });
    </script>
</body>
</html>
